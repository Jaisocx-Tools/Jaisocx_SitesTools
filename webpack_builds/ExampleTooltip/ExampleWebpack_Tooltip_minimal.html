<html>
<head>
    <title> Tooltip </title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

      body, main, h1, label {
        display: block;
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        height: 100vh; 
        width: 100vw; 
      }

      main {
        height: 100%; 
        width: 820px; 
        margin: 0 auto; 
        padding: 3rem;
        background-color: #f2f8ff;
      }

    </style>

</head>
<body>

    <main>
      
      <h1> Tooltip </h1>

      <button id="tooltip-button"> Click me! </button>

    </main>

</body>



<script src="transpiled/webpack/example-tooltip-bundle.js"></script>

<script>

  let tooltipDarkmode = new Object();

  document.addEventListener (
    "DOMContentLoaded",
    () => {
      tooltipDarkmode = new Tooltip();
      tooltipDarkmode
        .setEventTargetSelector( "#tooltip-button" )
        .setCssClasses( "theme-darkmode shown_effect_minimize_and_fadeIn with-transition" )
        .setHtml ( "Hello World!" )
        .render();
    }
  );

</script>

</html>
