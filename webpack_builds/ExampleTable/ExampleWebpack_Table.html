<!DOCTYPE html>
<html lang="en" id="css_table_imaged_preview" class="jsx">
<head>

  <link
      id="icon_jaisocx"
      rel="icon"
      type="image/x-icon"
      href="node_modules/@jaisocx/css_clean_start_lite/favicon/Icon_Jaisocx.ico"
      href-fallback="../css_clean_start_lite/favicon/Icon_Jaisocx.ico"
      onerror="javascript: ( () => { this.onerror = null; this.href = this.getAttribute( 'href-fallback' ); this.onerror = null; } )();"
  />

  <title> Table Imaged </title>



  <base href="./" />

  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />



  <!--# CSS CLEAN START 2: html & css WHEN STARTING A SITE FROM SCRATCH -->
  <link
      rel="stylesheet"
      type="text/css"
      charset="utf-8"
      href="node_modules/@jaisocx/css_clean_start_lite/MediaAndStyles/CssCleanStart_Lite_main_resolved.css"
      href-fallback="../css_clean_start_lite/MediaAndStyles/CssCleanStart_Lite_main_resolved.css"
      onerror="javascript: ( () => { this.onerror = null; this.href = this.getAttribute( 'href-fallback' ); this.onerror = null; } )();"
  />

  <style>

    .jsx#css_table_imaged_preview .table {
      --jsx--css-clean-start-2--custom-tags--display: inline-block;
    }

    .jsx#css_table_imaged_preview .table .table-row.header,
    .jsx#css_table_imaged_preview .table .table-row.header .table-row-field {
      display: flex;
    }

    .jsx#css_table_imaged_preview .table .table-body .table-row,
    .jsx#css_table_imaged_preview .table .table-body .table-row .table-row-field {
      display: grid;
    }

  </style>

</head>
<body>

<main>

    <h1>Table built by webpack example</h1>
    <p style="border: 1px solid #bb0000; border-radius: 0.6rem; display: inline-block; padding: 0.02rem 1rem; color: #bb0000; background-color: #fff5f5;">In development</p>

    <div>
      <button id="button-theme-base">Theme Base</button>
      <button id="button-theme-custom">Theme Custom</button>
    </div>

    <div id="table"></div>

  </main>

</body>

<script src="transpiled/webpack/example-table-bundle.js"></script>

<script>
  let table = new Object();

  document.addEventListener('DOMContentLoaded', () => {
    table = new Table();
    table
      .setHtmlHolderNodeSelector ( "#table" )
      //.setCssClasses ( "theme-custom" )
      .setConfUrl ( "json/table-conf_table-records_images_5.json" )
      .setDataUrl ( "json/table-records_images_5.json" )
      .setMobileLookAndFeelMaxWidth ( 830 )
      .load();



    document.getElementById("button-theme-base").addEventListener(
      "click",
      ( evt ) => {
        table.htmlHolderNode.className = "table";
      }
    );

    document.getElementById("button-theme-custom").addEventListener(
      "click",
      ( evt ) => {
        table.htmlHolderNode.className = "table theme-custom";
      }
    );

  });

</script>
</html>
