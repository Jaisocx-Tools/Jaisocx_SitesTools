  <style name="images_jaisocx_html_email_inliner">

    /**
    * why hardcoded and with the Star
    * several webmail applications set only padding-box style and several don't allow this css style.
    * then we just develop the email, at once knew, that the padding-box will be set with no other choice in some webmail.
    * this is now as the styles may be set for vieweing in other webmail applications,
    * but for quality and multiplatform support we just set the style that some platform sets by default and other cannot override.
    * no need for now getting know very exact the name of webmail app engine, chosen by a webmail provider,
    * the update of an engine is very expensive,
    * and this behavior tactic pattern is always good used.
    */

    .jaisocx_email_for_webmail ,
    .jaisocx_email_for_webmail body ,
    .jaisocx_email_for_webmail body.level_first ,
    .jaisocx_email_for_webmail .level_first ,
    .jaisocx_email_for_webmail .level_first .main_layout_block ,
    .jaisocx_email_for_webmail .level_first .main_layout_block * {
      display: block;
      position: relative;
      box-sizing: var(--jaisocx-email-for-webmail--all-tags--box-sizing);
    }



    .jaisocx_email_for_webmail.theme_emailed_thin,
    .jaisocx_email_for_webmail.theme_emailed_thin .level_first {
      display: block;
    }

    .jaisocx_email_for_webmail.theme_emailed_thin,
    .jaisocx_email_for_webmail.theme_emailed_thin .level_first,
    .jaisocx_email_for_webmail.theme_emailed_thin .level_first .main_layout_block {

      margin: 0;

      margin-top: 0;
      margin-left: 0;
      margin-right: 0;
      margin-bottom: 0;

      padding: 0;

      width: 100%;
      max-width: 100%;
      min-width: 100%;

      overflow-x: hidden;

      height: var(--jaisocx-email-for-webmail--email--height);
      max-height: var(--jaisocx-email-for-webmail--email--height);
      min-height: 100%;

      overflow-y: visible;

      background: var(--jaisocx-email-for-webmail--email--background-color);

    }



    /* Images with styles for emails in WebMail apps */

    .jaisocx_email_for_webmail.theme_emailed_thin .level_first .main_layout_block {

      display: block;

      min-width: 100%;
      max-width: 100%;
      width: 100%;

      margin: 0 0 0 0;
      padding: 0 0 0 0;

      text-align: center;

    }

    .jaisocx_email_for_webmail.theme_emailed_thin .level_first .main_layout_block   .images {
      display: inline-block;
      text-align: left;

      width: var(--jaisocx-email-for-webmail--images-layout-block--width);
      max-width: var(--jaisocx-email-for-webmail--images-layout-block--width);
      min-width: var(--jaisocx-email-for-webmail--images-layout-block--width);

      height: auto;
      max-height: max-content;
      min-height: fit-content;

      margin-bottom: 3rem;

      background: var(--jaisocx-email-for-webmail--email--background-color);
      border: var(--jaisocx-email-for-webmail--images-layout-block--border);

      overflow-y: visible;
      overflow-x: hidden;
    }



    .jaisocx_email_for_webmail.theme_emailed_thin .level_first .main_layout_block   .images .cell {
      display:   inline-block;
      text-align: center;

      min-width: var(--jaisocx-email-for-webmail--image-cell--width);
      max-width: 100%;
      width:     var(--jaisocx-email-for-webmail--image-cell--width);
      overflow-x: hidden;

      min-height:  var(--jaisocx-email-for-webmail--image-cell--height);
      max-height:  var(--jaisocx-email-for-webmail--image-cell--height);
      height:      var(--jaisocx-email-for-webmail--image-cell--height);
      overflow-y:  hidden;


      margin: 0 0 0 0;

      overflow: hidden;

      padding: var(--jaisocx-email-for-webmail--image-cell--padding);

      background: var(--jaisocx-email-for-webmail--image-cell--background);
      border: var(--jaisocx-email-for-webmail--image-cell--border);
    }



    .jaisocx_email_for_webmail.theme_emailed_thin .level_first .main_layout_block   .images .cell .image-holder {
      display: block;

<script>

  let globBaseUrlToReplace = "";
  let globBaseUrlReplacedWith = "";
  // globBaseUrlToReplace = "./../../../cdn/www/media/images/html_inliner_example/";
  // globBaseUrlReplacedWith = "images/";


  let debug = true;

  function showHide_InlinerButton( e, withCtrl, withShift, keyCode ) {

    let ctrl = withCtrl ? e.ctrlKey : true;
    let shift = withShift ? e.shift : true;

    if ( ctrl && shift && e.code === keyCode ) {
      let inlinerToolArea = document.querySelector( "email_html_inliner.jaisocx_email_html_inliner" );

      let shownStyleValue = ( inlinerToolArea.style.display === "none" ) ? "block" : "none";

      inlinerToolArea.style.display = shownStyleValue;

      if ( shownStyleValue === "none" ) {
        let textArea = document.querySelector("email_html_inliner.jaisocx_email_html_inliner .inlinertextarea");
        textArea.style.display = shownStyleValue;
      }
    }
  }


  function showInlineText( e ) {
    let textArea = document.querySelector("email_html_inliner.jaisocx_email_html_inliner .inlinertextarea");
    let shownStyleValue = ( textArea.style.display === "none" ) ? "block" : "none";
    textArea.style.display = shownStyleValue;
  }



  function inlineText( e, baseUrlToReplace, baseUrlReplacedWith ) {
    let inliner = new EmailHtmlInliner();
    inliner
      .setDebug( true )
      .setNumberBackgroundSpacesBefore_tagStart( 0 )
      .setNumberBackgroundSpacesBefore_attrStart( 2 )
      .setNumberBackgroundSpacesBefore_styleStart( 4 );


    let cssHtmlPackage = inliner.cssHtmlPackage;

    let inlineText = inliner.inline (
      document,
      "html",
      inliner.constants.stylesPropsToCheck,
      baseUrlToReplace,
      baseUrlReplacedWith
    );

    let textHtmlNode = document.querySelector("email_html_inliner.jaisocx_email_html_inliner .inlinetext");
    textHtmlNode.innerHTML = cssHtmlPackage.escapeHTML( inlineText );
  }

  async function copyInlineText( e ) {
    let cssHtmlPackage = new CssHtml();
    let textHtmlNode = document.querySelector("email_html_inliner.jaisocx_email_html_inliner .inlinetext");
    let inlineText = cssHtmlPackage.unescapeHTML( textHtmlNode.innerHTML );

    await navigator.clipboard.writeText( inlineText );

    return 1;
  }


  function inlineTextInNewTab( e ) {
    let cssHtmlPackage = new CssHtml();
    let textHtmlNode = document.querySelector( "email_html_inliner.jaisocx_email_html_inliner .inlinetext" );
    let inlineText = cssHtmlPackage.unescapeHTML( textHtmlNode.innerHTML );

    const newWin = window.open();
    newWin.document.write( inlineText );
    newWin.document.close(); // Important!
  }



  function assignEventHandler_ShowHide_InlinerButton( withCtrl, withShift, keyCode ) {
    document.addEventListener('keypress', function (e) {
      showHide_InlinerButton( e, withCtrl, withShift, keyCode );
    });
  }

  function assignEventHandler_BtnShowInlineText( buttonId, eventName ) {
    let eventTriggeringHtmlElem = document.querySelector( buttonId );

    eventTriggeringHtmlElem.addEventListener ( eventName, function(e){ showInlineText( e ); } );
  }

  function assignEventHandler_BtnInlineText( buttonId, eventName, baseUrlToReplace, baseUrlReplacedWith ) {
    let eventTriggeringHtmlElem = document.querySelector( buttonId );

    eventTriggeringHtmlElem.addEventListener ( eventName, function(e){ inlineText( e, baseUrlToReplace, baseUrlReplacedWith ); } );
  }

  function assignEventHandler_BtnCopyInlineText( buttonId, eventName ) {
    let eventTriggeringHtmlElem = document.querySelector( buttonId );

    eventTriggeringHtmlElem.addEventListener ( eventName, function(e){ copyInlineText( e ); } );
  }

  function assignEventHandler_BtnInlineTextInNewTab( buttonId, eventName ) {
    let eventTriggeringHtmlElem = document.querySelector( buttonId );

    eventTriggeringHtmlElem.addEventListener ( eventName, function(e){ inlineTextInNewTab( e ); } );
  }

  function assignEventsHandlers() {
    assignEventHandler_ShowHide_InlinerButton( true, false, "KeyQ" );
    assignEventHandler_BtnShowInlineText( "email_html_inliner.jaisocx_email_html_inliner .btn-show-inline-text", "click" );
    assignEventHandler_BtnInlineText( "email_html_inliner.jaisocx_email_html_inliner .btn-inline-html", "click", globBaseUrlToReplace, globBaseUrlReplacedWith );
    assignEventHandler_BtnCopyInlineText( "email_html_inliner.jaisocx_email_html_inliner .btn-copy-inline-text", "click" );
    assignEventHandler_BtnInlineTextInNewTab( "email_html_inliner.jaisocx_email_html_inliner .btn-inline-text-in-new-tab", "click" );
  }

  document.addEventListener( "DOMContentLoaded", () => { assignEventsHandlers(); } );

</script>
