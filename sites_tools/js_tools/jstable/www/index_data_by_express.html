<!DOCTYPE html>
<html>
  <head>
    <title> JS Table </title>

    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <link id="jstableStylesheet" rel="stylesheet" href="css/jstable.css" />
    <link id="jstableStylesheetLittle" rel="stylesheet" href="css/jstable-little.css" />
  </head>
  <body>
    <main>
      <div class="jstable" id="jstable-01"></div>

      <notice> Works with local Express "https://local.basetasks.site:9443/" env setting in "workspace/ts/.env.dynamic": Line 23 export   start_express_secure=true </notice>
    </main>
  </body>



<script src="js/JSTable.js"></script>
<script>

  let jsTable = null;
  let jsonBaseUrl = "https://local.basetasks.site:9443/json/data/";
  let extension = "-by-express.json";
  // let extension = ".json";

  document.addEventListener('DOMContentLoaded', () => {
    jstable = new JSTable();
    jstable
      .setElementId("jstable-01")
      .setMetadataUrl( [jsonBaseUrl, "table-conf", extension ].join("") )
      .setDataUrl( [jsonBaseUrl, "table-records", extension ].join("") )
      .setMobileLookAndFeelMaxWidth(630)
      .load();
  });

</script>
</html>
