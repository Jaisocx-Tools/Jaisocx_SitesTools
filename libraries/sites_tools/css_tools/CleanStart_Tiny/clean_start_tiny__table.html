<!DOCTYPE html>
<html lang="en" class="jaisocx clean_start">
<head>

  <!--# FAVICON -->
  <link
      rel="icon"
      type="image/x-icon"
      href="favicon/Icon_Jaisocx.ico"
  />

  <title> Jaisocx clean_start_tiny </title>



  <base href="./" />

  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />


  <!--# CleanStart_Tiny -->
  <link
      rel="stylesheet"
      type="text/css"
      charset="utf-8"
      href="MediaAndStyles/clean_start_tiny__all_features.css"
  />

  <!--# CleanStart_Tiny Theme_Base -->
  <link
      rel="stylesheet"
      type="text/css"
      charset="utf-8"
      href="MediaAndStyles/themes/theme_base/clean_start_tiny__theme_base.css"
  />


  <style id="layout_block_preview" name="clean_start_preview_page">

    .jaisocx.clean_start layout-block.preview {
      display: block;
      border: 1px solid lime;
      background-color: #fdfdfd;
      padding: 1rem;
      margin: 1rem 0 0 1rem 0;
      overflow: auto;
    }

    .jaisocx.clean_start layout-block.preview.tag_pre {
      margin: 0.3rem 0 0.3rem 0;
    }
    .jaisocx.clean_start layout-block.preview pre {
      margin: 0rem 0 -1.0rem 0;
      overflow: visible;
    }

  </style>


  <style id="scrolls" name="clean_start_preview_page">

    .clean_start .fixed_height_n_scrollbar {
      height: 10rem;

      min-width: unset;
      max-width: 100%;
      width: 30rem;

      padding: 0 1rem 1rem 1rem;
      border: 1px solid lime;
      background-color: #fdfdfd;

      overflow-x: scroll;
      overflow-y: scroll;
    }

    .clean_start .fixed_height_n_scrollbar layout-block {
      height: auto;

      min-width:  45rem;
      max-width:  45rem;
      width:  45rem;

      overflow-x: hidden;
      overflow-y: visible;
    }

  </style>


  <style id="mobile_friendly" name="clean_start_preview_page_responsive">

    /* portrait, xxxs til mobile xxs */
    /* filters by widths */
    @media only screen and (min-width: 5px) and (max-width: 280px) and (min-height: 5px) and (max-height: 1240px) and (orientation: portrait) {
      .jaisocx.clean_start {

        /* @start_block: @jaisocx/responsive_sizes helper library variables */
        --theme_name: clean_start_tiny__theme_base;
        --theme_name__clean_start_tiny: theme_base;

        --responsive_size: responsive_size__html__xxxs_til_d05_very_small_xxs_portrait;

        --responsive_size__min-width: 5px;
        --responsive_size__max-width: 280px;

        --responsive_size__min-height: 5px;
        --responsive_size__max-height: 1240px;
        /* @finish_block: @jaisocx/responsive_sizes helper library variables */


        /* styles */
        --clean_start--site--min-width: 100%;
        --clean_start--site--max-width: 100%;
        --clean_start--site--width: 100%;

        --clean_start--site--padding: 1rem 0.3rem 2rem 0.3rem;
      }
    }


    /* portrait, mobile xs til mobile md */
    /* filters both by by widths and heights */
    @media only screen and (min-width: 281px) and (max-width: 480px) and (min-height: 431px) and (max-height: 1240px) and (orientation: portrait) {
      .jaisocx.clean_start {

        /* @start_block: @jaisocx/responsive_sizes helper library variables */
        --theme_name: clean_start_tiny__theme_base;
        --theme_name__clean_start_tiny: theme_base;

        --responsive_size: responsive_size__html__d05_e08_very_small_xxs__til__midsize_md_portrait;

        --responsive_size__min-width: 281px;
        --responsive_size__max-width: 480px;

        --responsive_size__min-height: 431px;
        --responsive_size__max-height: 1240px;
        /* @finish_block: @jaisocx/responsive_sizes helper library variables */


        --clean_start--site--min-width: 92%;
        --clean_start--site--max-width: 100%;
        --clean_start--site--width: 92%;

        --clean_start--site--padding: 1.2rem 0.3rem 5rem 0.3rem;
      }
    }


    /* landscape, xxxs height til mobile md */
    /* filters both by by widths and heights */
    @media only screen and (min-width: 281px) and (max-width: 1024px) and (min-height: 5px) and (max-height: 480px) and (orientation: landscape) {
      .jaisocx.clean_start {

        /* @start_block: @jaisocx/responsive_sizes helper library variables */
        --theme_name: clean_start_tiny__theme_base;
        --theme_name__clean_start_tiny: theme_base;

        --responsive_size: responsive_size__html__d05_e08_very_small_xxs__til__midsize_md_landscape;

        --responsive_size__min-width: 281px;
        --responsive_size__max-width: 1024px;

        --responsive_size__min-height: 5px;
        --responsive_size__max-height: 480px;
        /* @finish_block: @jaisocx/responsive_sizes helper library variables */


        --clean_start--site--min-width: 95%;
        --clean_start--site--max-width: 100%;
        --clean_start--site--width: 95%;

        --clean_start--site--padding: 0.3rem 0.3rem 1rem 0.3rem;
      }
    }

  </style>

  <head>
<body>
<main>

<h1> Jaisocx clean_start_tiny ® </h1>

  <layout-block name="layout2_d_tb" class="preview">

    <table>
      <!-- Table Caption -->
      <caption> Table Caption </caption>

      <!-- Define column styles -->
      <colgroup>
        <col style="width: 8rem;">
        <col style="width: 8rem;">
        <col style="width: 8rem;">
        <col style="width: 8rem;">
      </colgroup>

      <!-- Table Header -->
      <thead>
        <tr>
          <th>Product</th>
          <th>Price</th>
          <th>Quantity</th>
          <th>Total</th>
        </tr>
      </thead>

      <!-- Table Body -->
      <tbody>
      <tr>
        <td> 🍎 Apple </td>
        <td>$1.00</td>
        <td>5</td>
        <td>$5.00</td>
      </tr>
      <tr>
        <td> 🍌 Banana </td>
        <td>$0.50</td>
        <td>10</td>
        <td>$5.00</td>
      </tr>
      <tr>
        <td> 🍊 Orange </td>
        <td>$0.80</td>
        <td>7</td>
        <td>$5.60</td>
      </tr>
      </tbody>

      <!-- Table Footer -->
      <tfoot>
        <tr>
          <td colspan="3">Sum</td>
          <td> $15.60 </td>
        </tr>
      </tfoot>
    </table>

  </layout-block>

</main>
</body>
</html>
